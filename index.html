function buildCrab(){
  const shellC=0x2f86c2, darkC=0x236fa6, bellyC=0xf5ecd8;
  const root=new THREE.Group();
  const body=new THREE.Group(); body.position.y=.55; root.add(body);
  const shell=sph(.55,shellC,0,0,0,body); shell.scale.set(1.15,.72,.92); shell.material.roughness=.45;
  const belly=sph(.5,bellyC,0,-.1,.12,body); belly.scale.set(1.0,.5,.8);
  for(const [x,y,z,r] of [[-.25,.33,-.1,.09],[.2,.36,-.2,.07],[.05,.38,.05,.06],[.35,.25,.1,.06]]) sph(r,0x8cc8ea,x,y,z,body).scale.y=.5;
  const cheeks=[]; for(const s of [-1,1]){ const c=sph(.07,0xf3a6b8,s*.32,.02,.44,body); c.scale.set(1,.6,.4); cheeks.push(c); }
  const mouth=add(new THREE.TorusGeometry(.065,.018,8,16,Math.PI), 0x27363f, body, 0,.02,.5,false); mouth.rotation.z=Math.PI;
  const mouthO=sph(.05,0x7a2a2a,0,-.01,.49,body); mouthO.scale.set(1,.8,.4); mouthO.visible=false;
  // 目
  const eyes=[];
  for(const s of [-1,1]){
    const stalk=new THREE.Group(); stalk.position.set(s*.2,.32,.2); body.add(stalk);
    cyl(.045,.055,.36,darkC,0,0,0,stalk,10);
    const eye=new THREE.Group(); eye.position.y=.42; stalk.add(eye);
    sph(.14,0xffffff,0,0,0,eye);
    const pupil=sph(.075,0x1b2328,0,0,.1,eye);
    sph(.025,0xffffff,.03,.03,.16,eye);
    const lid=sph(.15,shellC,0,0,0,eye); lid.scale.set(1,1,1); lid.visible=false;
    stalk.rotation.z=-s*.18;
    eyes.push({stalk,eye,pupil,lid,s});
  }
  // 帽子（ニット）
  const hat=new THREE.Group(); hat.position.set(0,.34,-.12); body.add(hat);
  const hb=sph(.24,0xf2c14e,0,0,0,hat); hb.scale.set(1,.7,1);
  const brim=add(new THREE.TorusGeometry(.22,.05,8,24),0xe0a92d,hat,0,-.02,0); brim.rotation.x=Math.PI/2;
  sph(.08,0xffffff,0,.2,0,hat);
  // 腕とハサミ
  const arms=[];
  for(const s of [-1,1]){
    const sh=new THREE.Group(); sh.position.set(s*.55,-.02,.18); body.add(sh);
    const up=cyl(.065,.065,.34,darkC,0,0,0,sh,10); up.rotation.z=Math.PI/2; up.position.set(s*.17,0,0);
    const claw=new THREE.Group(); claw.position.set(s*.36,0,0); sh.add(claw);
    const palm=sph(.17,shellC,0,0,0,claw); palm.scale.set(1.15,.85,.85); palm.material.roughness=.45;
    const upper=new THREE.Group(); upper.position.set(s*.12,.04,0); claw.add(upper);
    const uj=sph(.12,shellC,s*.12,0,0,upper); uj.scale.set(1.5,.55,.75);
    const lower=new THREE.Group(); lower.position.set(s*.12,-.05,0); claw.add(lower);
    const lj=sph(.09,bellyC,s*.1,0,0,lower); lj.scale.set(1.4,.5,.7);
    arms.push({sh,claw,upper,lower,s});
  }
  // 脚
  const legs=[];
  for(const s of [-1,1]) for(let i=0;i<3;i++){
    const p=new THREE.Group(); p.position.set(s*.48,-.12,-.22+i*.2); body.add(p);
    const seg=cyl(.04,.03,.48,darkC,0,-.48,0,p,8);
    p.userData.base=s*.62; p.rotation.z=p.userData.base;
    legs.push({p,s,i});
  }
  // 本（読書用）
  const book=new THREE.Group(); book.position.set(0,.05,.72); book.rotation.y=Math.PI; body.add(book); book.visible=false; // ページ面をナギ側へ
  rbox(.34,.46,.06,.02,0xe8554a,-.17,-.23,0,book).rotation.y=.35;
  rbox(.34,.46,.06,.02,0x2477b3,.17,-.23,0,book).rotation.y=-.35;
  box(.6,.42,.04,0xffffff,0,-.21,.03,book);
  // じょうろ
  const can=new THREE.Group(); can.visible=false;
  cyl(.13,.15,.26,0x4c9a5b,0,-.13,0,can,16); const nz=cyl(.025,.035,.3,0x4c9a5b,0,-.05,0,can,8); nz.rotation.z=-1.0; nz.position.set(.2,.05,0);
  arms[1].claw.add(can); can.position.set(.2,-.12,.05);
  root.traverse(o=>{ o.userData.crab=true; });
  return {root,body,eyes,arms,legs,mouth,mouthO,book,can,hat};
}

const parts=[];
function emit(tex, pos, o={}){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex, transparent:true, depthWrite:false}));
  const sz=o.size||.45; s.scale.set(sz,sz,sz); s.position.copy(pos); scene.add(s);
  parts.push({s, v:o.v||V(rand(-.2,.2),rand(.6,1),rand(-.2,.2)), life:o.life||1.6, age:0, g:o.g||0, size:sz});
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.age+=dt; p.v.y-=p.g*dt; p.s.position.addScaledVector(p.v,dt);
    const k=p.age/p.life; p.s.material.opacity=1-k*k; p.s.scale.setScalar(p.size*(1+k*.3));
    if(p.age>=p.life){ scene.remove(p.s); p.s.material.dispose(); parts.splice(i,1);} }
}

/* ---------- 移動 ---------- */
const HUBS=[V(-6.5,0,.8),V(-2.5,0,.8),V(1.5,0,.8),V(4.2,0,.8),V(8.4,0,1.5),V(11,0,1.5)];
const d2=(a,b)=>(a.x-b.x)**2+(a.z-b.z)**2;
function nearestHub(p){ let bi=0,bd=1e9; HUBS.forEach((h,i)=>{ const d=d2(h,p); if(d<bd){bd=d;bi=i;} }); return bi; }
function buildPath(from,to){
  const a=nearestHub(from), b=nearestHub(to);
  if(a===b || Math.sqrt(d2(from,to))<1.6) return [to.clone()];
  const pts=[]; const st=a<b?1:-1;
  for(let i=a;i!==b+st;i+=st) pts.push(HUBS[i].clone());
  if(Math.sqrt(d2(pts[0],from))<.4) pts.shift();
  pts.push(to.clone()); return pts;
}
function groundY(x,z){ if(Math.abs(z)<5.7 && x<=9.15 && x>=-9.2) return F; if(x>9.15 && x<9.9 && Math.abs(z-1.5)<1.1) return lerp(F,.15,(x-9.15)/.75); return 0; }
function lerp(a,b,t){ return a+(b-a)*t; }
function angLerp(a,b,t){ let d=((b-a+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI; return a+d*t; }
function sidewaysFacing(dx,dz){
  const th=Math.atan2(-dz,dx), alt=th+Math.PI;
  return Math.cos(th)>=Math.cos(alt)?th:alt; // 正面(カメラ側)を向きやすい方
}
function moveToward(target, dt, spd=2.1){
  const p=C.root.position; const dx=target.x-p.x, dz=target.z-p.z; const d=Math.hypot(dx,dz);
  if(d<.06) return true;
  const step=Math.min(d,spd*dt); p.x+=dx/d*step; p.z+=dz/d*step;
  crab.facing=angLerp(crab.facing, sidewaysFacing(dx,dz), Math.min(1,dt*8));
  return d-step<.06;
}

/* ---------- 行動の開始と終了 ---------- */
function decide(){
  let best='wander', bs=-1e9;
  for(const k in ACTS){ let s=ACTS[k].score()+rand(0,16); if(k===crab.lastKey) s-=25; if(s>bs){bs=s;best=k;} }
  startAct(best);
}
function startAct(key, target, source){
  const def=ACTS[key]; if(!def) return;
  const a={key,def,t:0,dur:rand(def.dur[0],def.dur[1]),target:target||null, source};
  if(def.targetFn && !a.target){ a.target=def.targetFn(); if(!a.target){ startAct('wander'); return; } }
  let stand = def.stand || (def.standFn&&def.standFn()) || null;
  if(key==='eatFood') { const fp=a.target.mesh.position; const dir=V(C.root.position.x-fp.x,0,C.root.position.z-fp.z).normalize(); stand=V(fp.x+dir.x*.75,0,fp.z+dir.z*.75); if(!isFinite(stand.x)) stand=V(fp.x,0,fp.z+.75); }
  if(key==='play') stand = V(ball.mesh.position.x,0,ball.mesh.position.z);
  a.stand=stand;
  crab.act=a; crab.lastKey=key;
  crab.path = key==='play'?[]:buildPath(C.root.position, stand);
  crab.state = key==='play'?'acting':'walking';
  if(key==='play'){ a.started=true; }
  if(def.go.length && Math.random()<(source==='user'?1:.8)) say(pick(def.go));
  if(crab.state==='acting') def.start&&def.start(a);
}
function arrive(){
  const a=crab.act, def=a.def;
  if(def.perch){ crab.state='hopping'; crab.hop={from:C.root.position.clone(), to:def.perch.p.clone(), t:0, dur:.55, rot:def.perch.rot, then:()=>{ crab.perched=true; crab.state='acting'; def.start&&def.start(a); }}; }
  else { crab.state='acting'; def.start&&def.start(a); }
}
function finishAct(interrupted){
  const a=crab.act; if(!a) return; const def=a.def;
  def.end&&def.end(a);
  if(!interrupted && def.fin.length) say(pick(def.fin));
  if(def.diary && a.t>3) log(def.diary+(interrupted?'（途中まで）':''));
  crab.act=null;
  if(crab.perched){ crab.perched=false; crab.state='hopping'; crab.hop={from:C.root.position.clone(), to:V(a.stand.x,groundY(a.stand.x,a.stand.z),a.stand.z), t:0, dur:.5, then:()=>{ crab.state='idle'; crab.cooldown=rand(.8,1.6); }}; }
  else { crab.state='idle'; crab.cooldown=rand(.8,1.8); }
}
function request(key, source='user'){
  if(crab.act && crab.act.key===key){ say('もうやってるよ'); return; }
  if(crab.act && crab.act.key==='sleep' && key!=='sleep'){
    if(need.energy<40){ say('むにゃ…あとで…'); return; }
    say('ん…起きるよ…');
  }
  crab.pending={key,source};
  if(crab.state==='acting') finishAct(true);
}

const foodCols=[0xf3a6b8,0x4c9a5b,0xe8554a];
function placeFood(p){

  const g=new THREE.Group(); g.position.set(p.x,groundY(p.x,p.z),p.z); scene.add(g);
  cyl(.22,.16,.1,0xffffff,0,0,0,g); const f=sph(.16,pick(foodCols),0,.14,0,g); f.scale.y=.6;

}

function throwBall(p){

function updateBall(dt){

  ball.vy-=12*dt; p.y+=ball.vy*dt; if(p.y<F+r){ p.y=F+r; ball.vy=Math.abs(ball.vy)>1.2?-ball.vy*.45:0; }
  p.x+=ball.v.x*dt; p.z+=ball.v.z*dt; ball.v.multiplyScalar(Math.max(0,1-1.1*dt));

let codeRows=[], monT=0;
const codeCols=['#7cc4ea','#f2c14e','#f3a6b8','#9fd98a','#e6e6e6','#c7a4f2'];
function drawMonitor(coding, on, dt){

  } else {

/* ---------- アニメーション ---------- */
function animateCrab(dt){
  crab.poseT+=dt; const t=crab.poseT;
  const walking = crab.state==='walking' || (crab.act?.key==='play' && crab.moving);
  let pose = walking?'walk': (crab.state==='acting'? crab.act.def.pose : 'idle');
  if(crab.state==='hopping') pose='hop';
  const sad = Math.min(need.hunger,need.energy,need.moist)<18;
  const B=C.body, A=C.arms, L=C.legs, E=C.eyes;
  // 既定値
  let bodyY=.55, bodyRz=0, bodyRx=0, eyeClose=0, stalkDroop=0;
  const armPose=[{z:-.15,y:.5,open:.15},{z:-.15,y:.5,open:.15}];
  L.forEach(l=>{ l.p.rotation.x=0; l.p.rotation.z=l.p.userData.base; });
  switch(pose){
    case 'walk': { const f=t*13; bodyY+=Math.abs(Math.sin(f))*.05; bodyRz=Math.sin(f)*.06;
      L.forEach(l=>{ l.p.rotation.z=l.p.userData.base+Math.sin(f+l.i*2.1+(l.s>0?Math.PI:0))*.35; l.p.rotation.x=Math.cos(f+l.i*2.1)*.15; });
      armPose.forEach((a,i)=>{ a.z=-.05+Math.sin(f+i*Math.PI)*.12; a.open=.2+Math.sin(f*.5)*.15; }); break; }
    case 'type': { armPose.forEach((a,i)=>{ a.z=-.35+Math.max(0,Math.sin(t*16+i*Math.PI))*.25; a.y=.85; a.open=.05; }); bodyRx=-.05; break; }
    case 'eat': { armPose.forEach((a,i)=>{ const k=Math.max(0,Math.sin(t*5+i*Math.PI)); a.z=-.1+k*.55; a.y=.5+k*.8; a.open=.1+k*.2; }); bodyY+=Math.sin(t*10)*.01; break; }
    case 'sleep': { bodyY=.38+Math.sin(t*1.5)*.02; eyeClose=1; stalkDroop=.9; armPose.forEach(a=>{a.z=-.4;a.y=.9;a.open=0;}); break; }
    case 'read': { armPose.forEach(a=>{ a.z=.1; a.y=1.15; a.open=.05; }); bodyRx=.12; eyeClose=Math.sin(t*.7)>.97?1:0; break; }
    case 'bathe': { bodyY=.45+Math.sin(t*2)*.04; bodyRz=Math.sin(t*1.3)*.08; armPose.forEach((a,i)=>{ a.z=.6+Math.sin(t*2+i)*.1; a.y=.2; a.open=.3; }); eyeClose=.6; break; }
    case 'dance': { const f=t*6; bodyY+=Math.abs(Math.sin(f))*.18; bodyRz=Math.sin(f)*.25; armPose.forEach((a,i)=>{ a.z=.7+Math.sin(f+i*Math.PI)*.5; a.y=.2; a.open=.2+Math.max(0,Math.sin(f*2))*.4; });
      L.forEach(l=>{ l.p.rotation.z=l.p.userData.base+Math.sin(f*2+l.i)*.2; }); break; }
    case 'water': { armPose[1].z=.25+Math.sin(t*2)*.1; armPose[1].y=.3; armPose[1].open=.25; armPose[0].z=-.1; bodyRz=-.06; break; }
    case 'wave': { armPose[1].z=1.2; armPose[1].y=.1; armPose[1].open=.2+Math.max(0,Math.sin(t*9))*.5; armPose[1].wave=Math.sin(t*6)*.35; bodyY+=Math.abs(Math.sin(t*3))*.04; break; }
    case 'hop': { armPose.forEach(a=>{ a.z=.5; a.open=.35; }); break; }
    default: { bodyY+=Math.sin(t*2)*.012; armPose.forEach((a,i)=>{ a.z=-.15+Math.sin(t*1.3+i)*.05; a.open=.12+(Math.sin(t*.9+i*2)>.9?.35:0); }); }
  }
  if(sad && pose!=='sleep'){ stalkDroop=Math.max(stalkDroop,.45); }
  // リアクション（なでられたとき）
  if(crab.react){ const r=crab.react; r.t+=dt; const k=r.t/r.dur;
    if(r.kind==='happy'){ bodyY+=Math.sin(Math.min(1,k*2)*Math.PI)*.35; armPose.forEach(a=>{a.z=1.1+Math.sin(r.t*14)*.15; a.y=.2; a.open=.45;}); eyeClose= .85; }
    else if(r.kind==='dizzy'){ bodyRz=Math.sin(r.t*18)*.25; armPose.forEach(a=>{a.z=.3;a.open=.5;}); }
    else if(r.kind==='stir'){ bodyRz=Math.sin(r.t*8)*.08; }
    if(k>=1) crab.react=null; }
  // 反映
  B.position.y=lerp(B.position.y, bodyY, Math.min(1,dt*14)); B.rotation.z=lerp(B.rotation.z, bodyRz, Math.min(1,dt*10)); B.rotation.x=lerp(B.rotation.x, bodyRx, Math.min(1,dt*6));
  A.forEach((a,i)=>{ const p=armPose[i]; const s=a.s;
    a.sh.rotation.z=lerp(a.sh.rotation.z, s*p.z, Math.min(1,dt*12));
    a.sh.rotation.y=lerp(a.sh.rotation.y, -s*p.y, Math.min(1,dt*10));
    a.claw.rotation.x = p.wave||0;
    a.upper.rotation.z=lerp(a.upper.rotation.z, s*p.open, Math.min(1,dt*15)); a.lower.rotation.z=lerp(a.lower.rotation.z, -s*p.open*.7, Math.min(1,dt*15)); });
  // まばたき・視線
  crab.blinkT-=dt; let blink=0; if(crab.blinkT<0){ blink=1; if(crab.blinkT<-.12) crab.blinkT=rand(1.8,4.5); }
  crab.lookT-=dt; if(crab.lookT<0){ crab.lookT=rand(.8,2.5); crab.look.set(rand(-.04,.04),rand(-.02,.03),0); }
  const close=Math.max(eyeClose, blink);
  E.forEach(e=>{ e.eye.scale.y=lerp(e.eye.scale.y, close>.5?.12:1, Math.min(1,dt*25)); e.pupil.position.x=lerp(e.pupil.position.x,crab.look.x,dt*5); e.pupil.position.y=lerp(e.pupil.position.y,crab.look.y,dt*5);
    e.stalk.rotation.x=lerp(e.stalk.rotation.x, stalkDroop*.9, dt*4); e.stalk.rotation.z=-e.s*(.18+stalkDroop*.3); });
  // 口
  talkMouth=Math.max(0,talkMouth-dt); const talking=talkMouth>0 && Math.sin(t*22)>0;
  C.mouthO.visible = talking || pose==='eat'&&Math.sin(t*10)>0; C.mouth.visible=!C.mouthO.visible;
  C.mouth.rotation.z = sad?0:Math.PI; C.mouth.position.y = sad?-.04:.02;
}

/* ---------- 更新 ---------- */
function updateNeeds(dm){
  const sleeping=crab.act?.key==='sleep', bathing=crab.act?.key==='bath';
  need.hunger-= (sleeping?.04:.1)*dm;
  need.energy-= (sleeping?0:.066)*dm;
  need.fun  -= (sleeping?0:.1)*dm;
  need.moist-= (bathing?0:(sleeping?.03:.08))*dm;
  need.love -= (sleeping?.015:.045)*dm;
  for(const k in need) need[k]=clamp(need[k],0,100);
}
function updatePlants(dm){
  plants.forEach(p=>{ p.water=Math.max(0,p.water-.13*dm); if(p.water>25) p.growth=Math.min(1,p.growth+.0009*dm);
    const g=p.growth; p.stem.scale.y=.25+.75*g; p.stem.position.y=(.25+.75*g)*.5;
    const top=.25+.75*g; p.leaves.forEach((l,k)=>{ const y=top*(.3+k*.22); l.position.set(Math.cos(k*2.3)*.12,y,Math.sin(k*2.3)*.12); l.rotation.y=k*2.3; l.scale.setScalar(.5+g*.6); l.scale.y*=.35; });
    p.flower.position.y=top+.02; const fk=clamp((g-.6)/.4,0,1); p.flower.visible=fk>0; p.flower.scale.setScalar(.2+fk*.8);
    p.g.rotation.z = p.water<20? .25 : 0; });
}
let lastHour=Math.floor(hour()), manualOffAt=-999;
function updateTime(dm){
  const prev=gameMin; gameMin+=dm; if(Math.floor(prev/1440)!==Math.floor(gameMin/1440)){ day++; log(day+'日目がはじまった'); }
  const h=Math.floor(hour());
  if(h!==lastHour){ lastHour=h;
    if(h===18 && crab.act?.key!=='sleep' && !lightsOn){ setLights(true); say('暗くなってきた、電気つけよ'); log('電気をつけた'); }
    if(h===7 && lightsOn && crab.act?.key!=='sleep'){ setLights(false); log('電気を消した'); }
    else if(isNight() && !lightsOn && crab.act?.key!=='sleep' && gameMin-manualOffAt>60){ setLights(true); say('暗いな、電気つけよ'); log('電気をつけた'); }
  }
}
function updateCrab(sdt, dm){
  const p=C.root.position;
  if(crab.pending && (crab.state==='idle'||crab.state==='walking')){ const q=crab.pending; crab.pending=null; if(crab.act) { crab.act.def.end&&crab.act.def.end(crab.act); crab.act=null; } startAct(q.key,null,q.source); }
  if(crab.react && crab.react.kind!=='stir'){ /* リアクション中は移動しない */ }
  else switch(crab.state){
    case 'idle':
      crab.cooldown-=sdt; crab.facing=angLerp(crab.facing,0,Math.min(1,sdt*3));
      if(crab.cooldown<=0) decide(); break;
    case 'walking':
      if(crab.path.length){ if(moveToward(crab.path[0], sdt)) crab.path.shift(); }
      else { const f=crab.act.def.face; if(f!==undefined) crab.facing=f; arrive(); }
      break;
    case 'hopping': {
      const hp=crab.hop; hp.t+=sdt/hp.dur; const k=Math.min(1,hp.t); const e=k*k*(3-2*k);
      p.x=lerp(hp.from.x,hp.to.x,e); p.z=lerp(hp.from.z,hp.to.z,e); p.y=lerp(hp.from.y,hp.to.y,e)+Math.sin(k*Math.PI)*.7;
      if(hp.rot!==undefined) crab.facing=angLerp(crab.facing,hp.rot,Math.min(1,sdt*10));
      if(k>=1){ crab.hop=null; hp.then(); } break; }
    case 'acting': {
      const a=crab.act, def=a.def; a.t+=dm;
      if(def.perch) crab.facing=angLerp(crab.facing,def.perch.rot,Math.min(1,sdt*6));
      else if(def.face!==undefined) crab.facing=angLerp(crab.facing,def.face,Math.min(1,sdt*5));
      if(a.key==='play') playTick(a, sdt);
      else if(a.key==='eatFood' && a.target){ const fp=a.target.mesh.position; crab.facing=angLerp(crab.facing, Math.atan2(fp.x-p.x, fp.z-p.z), Math.min(1,sdt*6)); }
      def.tick&&def.tick(dm,a);
      crab.talkT-=sdt; if(crab.talkT<0){ crab.talkT=rand(7,14); if(def.mid.length && Math.random()<.6) say(pick(def.mid)); }
      const done = def.done? def.done(a) : a.t>=a.dur;
      if(done || (a.key==='play'&&!ball) || (a.key==='eatFood'&&!foods.includes(a.target))) finishAct(false);
      break; }
  }
  if(crab.state!=='hopping' && !crab.perched) p.y=lerp(p.y, groundY(p.x,p.z), Math.min(1,sdt*12));
  C.root.rotation.y=crab.facing;
  animateCrab(sdt);
}
function playTick(a, sdt){
  const p=C.root.position, b=ball.mesh.position; const d=Math.hypot(b.x-p.x,b.z-p.z);
  crab.moving = d>.75;
  if(crab.moving) moveToward(V(b.x,0,b.z), sdt, 2.8);
  else { crab.facing=angLerp(crab.facing,0,sdt*4); if(Math.hypot(ball.v.x,ball.v.z)<.4 && Math.random()<sdt*2){ const dir=V(b.x-p.x,0,b.z-p.z).normalize(); dir.x+=rand(-.6,.6); dir.z+=rand(-.6,.6); dir.normalize(); kickBall(dir, rand(3,6)); if(Math.random()<.4) say(pick(ACTS.play.mid)); } }
  need.fun+=.9*sdt*MIN_PER_SEC/1; need.energy-=.08*sdt*MIN_PER_SEC; need.love+=.08*sdt*MIN_PER_SEC;
}

/* ---------- ふれあい ---------- */
function pet(){
  const now=performance.now(); crab.petLog=crab.petLog.filter(t=>now-t<3000); crab.petLog.push(now);
  if(crab.act?.key==='sleep'){ crab.react={kind:'stir',t:0,dur:.8}; say(pick(['むにゃ…','ん…？','すぴー'])); need.love+=2; return; }
  if(crab.petLog.length>=6){ crab.react={kind:'dizzy',t:0,dur:1.2}; say('もう、くすぐったいってば！'); crab.petLog=[]; return; }
  crab.react={kind:'happy',t:0,dur:.9};
  const wasGreet = crab.act?.key==='greet';
  need.love+=wasGreet?12:6; need.fun+=2;
  for(let i=0;i<3;i++) emit(glyphTex('♥','#e8554a'), headPos().add(V(rand(-.4,.4),rand(-.2,.2),rand(0,.3))), {v:V(rand(-.3,.3),rand(.8,1.2),0),life:1.3,size:.4});
  say(wasGreet? pick(['えへへ、うれしい','来てくれた！']) : pick(['えへへ','くすぐったい','もっと〜','ぷく♪']));
  if(wasGreet && crab.state==='acting'){ log('なでてもらった'); setTimeout(()=>{ if(crab.act?.key==='greet') finishAct(true); },900); }
}
const REPLIES=[
  [/こんにち|こんちは|やあ|はろー|hello/i, ()=>pick(['こんにちは！','やあ、いらっしゃい'])],
  [/おはよ/, ()=>H()<11?'おはよう！きょうもいい日':'もうお昼すぎだよ？'],
  [/こんばん/, ()=>'こんばんは〜'],
  [/すき|好き|かわい/, ()=>{ need.love+=10; emit(glyphTex('♥','#e67aa0'),headPos(),{size:.6}); return pick(['ぼくもすき！','てれる…ぷく']); }],
  [/おなか|ごはん|食べ/, ()=> need.hunger<40?'おなかぺこぺこ…':need.hunger<75?'ちょっと空いたかも':'おなかいっぱい'],
  [/ねて|寝て|おやすみ|ねむ/, ()=>{ if(need.energy<85||isNight()){ setTimeout(()=>request('sleep'),600); return 'じゃあ寝ようかな'; } return 'まだ元気だよ'; }],
  [/あそ|遊/, ()=>{ if(ball){ setTimeout(()=>request('play'),600); return 'ボールで遊ぼ！'; } return 'ボール投げてくれたら遊ぶ！'; }],
  [/コード|プログラ|バグ|仕事/, ()=>pick(['いまはテストを書いてる','バグは友だち…じゃない','コミット'+commits+'回したよ'])],
  [/お風呂|風呂|ふろ/, ()=>{ setTimeout(()=>request('bath'),600); return 'ひとっ風呂いこっか'; }],
  [/花|水やり|庭/, ()=>{ const n=plants.filter(p=>p.growth>.6).length; return n?'花が'+n+'つ咲いたよ':'まだつぼみ。水やりがんばる'; }],
  [/名前|だれ|誰/, ()=>'ナギだよ。海の近くから越してきたカニ'],
  [/げんき|元気|調子/, ()=> Math.min(need.hunger,need.energy,need.moist)<30?'ちょっとへろへろ…':'げんき！'],
];
function talk(text){
  if(!text.trim()) return;
  log('「'+text+'」と話しかけられた');
  if(crab.act?.key==='sleep'){ say('むにゃ…'+(Math.random()<.5?'…かに…':'すぴー')); return; }
  crab.facing=0;
  for(const [re,fn] of REPLIES){ if(re.test(text)){ say(fn(),3.2); need.love+=2; return; } }
  say(pick(['ほほう','なるほど？','ぷく？','それってどういうこと？','うんうん']),2.6); need.love+=1;
}

/* ---------- 入力 ---------- */
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let tool=null, downPos=null;
const marker=add(new THREE.RingGeometry(.25,.36,32), new THREE.MeshBasicMaterial({color:0xe8554a, transparent:true, opacity:.8, side:THREE.DoubleSide}), null,0,0,0,false);
marker.rotation.x=-Math.PI/2; marker.visible=false;
function cast(e){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse,camera);
  return ray.intersectObjects(scene.children,true).filter(h=>h.object.visible && !(h.object.isSprite) && h.object!==marker);
}
renderer.domElement.addEventListener('pointerdown',e=>{ downPos=[e.clientX,e.clientY]; });
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.pointerType!=='mouse') return;
  const hits=cast(e); const h=hits[0];
  let pointer=false;
  if(tool){ const f=hits.find(x=>floorMeshes.includes(x.object)); if(f){ marker.visible=true; marker.position.set(f.point.x, f.point.y+.02, f.point.z); pointer=true; } else marker.visible=false; }
  else if(h && (h.object.userData.crab || h.object.userData.act || (ball&&isBall(h.object)))) pointer=true;
  renderer.domElement.style.cursor = pointer?'pointer':'grab';
});
function isBall(o){ while(o){ if(ball && o===ball.mesh) return true; o=o.parent; } return false; }
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downPos || Math.hypot(e.clientX-downPos[0],e.clientY-downPos[1])>6) return;
  const hits=cast(e); if(!hits.length) return; const h=hits[0];
  if(tool){ const f=hits.find(x=>floorMeshes.includes(x.object)) ; if(f){ tool==='food'?placeFood(f.point):throwBall(f.point); setTool(null); } return; }
  if(h.object.userData.crab){ pet(); return; }
  if(ball && isBall(h.object)){ const dir=V(h.point.x-camera.position.x,0,h.point.z-camera.position.z).normalize(); kickBall(dir,6); if(crab.act?.key!=='play'&&crab.act?.key!=='sleep'&&need.energy>20) request('play'); return; }
  const act=h.object.userData.act; if(act){ const names={sleep:'寝る？',code:'コード書く？',eat:'ごはんにする？',bath:'お風呂入る？',read:'本読む？',music:'音楽かける？',garden:'水やりする？',window:'外見る？'};
    log('「'+names[act]+'」とおねがいされた'); request(act); }
});
const hint=document.getElementById('hint'); const DEFAULT_HINT=hint.textContent;
function setTool(t){ tool=t; document.getElementById('bFood').classList.toggle('on',t==='food'); document.getElementById('bBall').classList.toggle('on',t==='ball');
  hint.textContent = t==='food'?'床をクリックしてごはんを置く（最大3つ）':t==='ball'?'床をクリックしてボールを投げる':DEFAULT_HINT; if(!t) marker.visible=false; }
document.getElementById('bFood').onclick=()=>setTool(tool==='food'?null:'food');
document.getElementById('bBall').onclick=()=>setTool(tool==='ball'?null:'ball');
document.getElementById('bLight').onclick=()=>{ setLights(!lightsOn); if(!lightsOn) manualOffAt=gameMin; log(lightsOn?'だれかが電気をつけた':'だれかが電気を消した');
  if(crab.act?.key==='sleep' && lightsOn) say('まぶしい…'); else if(!lightsOn && isNight() && crab.act?.key!=='sleep') say('まっくら！'); };
document.getElementById('bFollow').onclick=(e)=>{ follow=!follow; e.target.classList.toggle('on',follow); e.target.textContent=follow?'追うのをやめる':'ナギを追う';
  if(follow){ const c=C.root.position; controls.target.set(c.x,c.y+.8,c.z); camera.position.set(c.x+1.5,c.y+4.5,c.z+7.5); }
  if(!follow){ controls.target.copy(TGT_HOME); camera.position.copy(CAM_HOME);} };
document.getElementById('talk').addEventListener('submit',e=>{ e.preventDefault(); const i=document.getElementById('talkIn'); talk(i.value); i.value=''; });
document.querySelectorAll('#speed button').forEach(b=>b.onclick=()=>{ speed=+b.dataset.s; document.querySelectorAll('#speed button').forEach(x=>x.classList.toggle('on',x===b)); });
addEventListener('keydown',e=>{ if(e.key==='Escape') setTool(null); });

/* ---------- UI ---------- */
const bars=document.getElementById('bars'); const barEls={};
NEED_META.forEach(([k,label,col])=>{ const d=document.createElement('div'); d.className='bar'; d.innerHTML='<span>'+label+'</span><div class="track"><div class="fill" style="background:'+col+'"></div></div><span></span>'; bars.appendChild(d); barEls[k]=[d.querySelector('.fill'),d.lastChild]; });
const doingEl=document.getElementById('doing'), clockEl=document.getElementById('clock');
function periodName(){ const h=hour(); return h<5?'深夜':h<10?'朝':h<16?'昼':h<19?'夕方':'夜'; }
function updateUI(){
  for(const k in barEls){ const v=Math.round(need[k]); barEls[k][0].style.width=v+'%'; barEls[k][1].textContent=v; }
  clockEl.textContent=day+'日目 '+fmt(gameMin)+'（'+periodName()+'）';
  let d='ひと休み中', sub='';
  if(crab.state==='walking') { d='移動中'; sub='→ '+crab.act.def.doing; }
  else if(crab.act) d=crab.act.def.doing;
  const low=[]; if(need.hunger<25) low.push('おなかぺこぺこ'); if(need.energy<25) low.push('ねむい'); if(need.moist<25) low.push('からだがカラカラ'); if(need.love<25) low.push('さみしい');
  if(low.length) sub=(sub?sub+' ／ ':'')+low.join('・');
  doingEl.innerHTML=''; doingEl.appendChild(document.createTextNode(d)); if(sub){ const s=document.createElement('small'); s.textContent=sub; doingEl.appendChild(s); }
  document.getElementById('commits').textContent=commits;
  document.getElementById('flowers').textContent=plants.filter(p=>p.growth>.6).length;
}
const tmpV=new THREE.Vector3();
function updateBubble(rdt){
  if(bubbleT>0){ bubbleT-=rdt; if(bubbleT<=0) bubble.classList.remove('show'); }
  tmpV.copy(C.root.position).add(V(0,1.75,0)).project(camera);
  const x=(tmpV.x*.5+.5)*innerWidth, y=(-tmpV.y*.5+.5)*innerHeight;
  bubble.style.left=x+'px'; bubble.style.top=y+'px';
}

/* ---------- ループ ---------- */
log('ナギのおうちへようこそ');
setTimeout(()=>say('いらっしゃい！'),600);
let last=performance.now(), uiT=0;
function frame(now){
  const rdt=Math.min(.05,(now-last)/1000); last=now;
  const sdt=rdt*speed, dm=sdt*MIN_PER_SEC;
  updateTime(dm); updateNeeds(dm); updatePlants(dm);
  updateCrab(sdt, dm);
  // 一時停止中もまばたきだけは続ける
  if(speed===0){ animateCrab(rdt*0); }
  updateBall(sdt); updateParts(Math.max(sdt,0)); updateSky(); applyLights();
  drawMonitor(crab.act?.key==='code' && crab.state==='acting', !(crab.act?.key==='sleep') , sdt);
  if(follow){ const old=controls.target.clone(); controls.target.lerp(C.root.position.clone().add(V(0,.8,0)), Math.min(1,rdt*3)); camera.position.add(controls.target.clone().sub(old)); }
  controls.update(); renderer.render(scene,camera);
  updateBubble(rdt);
  uiT+=rdt; if(uiT>.2){ uiT=0; updateUI(); }
  requestAnimationFrame(frame);
}
window.nagiDebug={ setTime(h){ gameMin=Math.floor(gameMin/1440)*1440+h*60; } };
requestAnimationFrame(frame);
function fitView(){
  camera.aspect=innerWidth/innerHeight; renderer.setSize(innerWidth,innerHeight);
  if(innerWidth>760){ // 右パネルの分だけ描画の中心を左へ
    const shift=330; camera.fov=38; camera.setViewOffset(innerWidth+shift, innerHeight, shift, 0, innerWidth, innerHeight);
  } else { // 下パネルの分だけ中心を上へ、縦長画面は画角を広げる
    const sy=Math.round(innerHeight*.38); camera.fov=innerWidth<innerHeight?68:44; camera.setViewOffset(innerWidth, innerHeight+sy, 0, sy, innerWidth, innerHeight);
  }
  camera.updateProjectionMatrix();
}
fitView(); addEventListener('resize',fitView);
</script>
